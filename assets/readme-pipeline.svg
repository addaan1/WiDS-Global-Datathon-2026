<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Notebook pipeline">
  <defs>
    <linearGradient id="bg" x1="80" y1="72" x2="1308" y2="828" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="0.5" stop-color="#101827"/>
      <stop offset="1" stop-color="#1D1B2B"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#181E35"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="900" rx="32" fill="url(#bg)"/>
  <text x="68" y="92" fill="#F8FAFC" font-size="40" font-weight="800" font-family="Segoe UI, Arial, sans-serif">Notebook Pipeline</text>
  <text x="68" y="132" fill="#94A3B8" font-size="20" font-weight="500" font-family="Segoe UI, Arial, sans-serif">The workflow is designed to be readable, modular, and competitive for a small censored dataset.</text>

  <rect x="68" y="196" width="250" height="130" rx="24" fill="url(#card)" stroke="#F59E0B" stroke-opacity="0.48"/>
  <text x="96" y="244" fill="#FDE68A" font-size="24" font-weight="700" font-family="Segoe UI, Arial, sans-serif">1. Data Understanding</text>
  <text x="96" y="282" fill="#CBD5E1" font-size="17" font-weight="500" font-family="Segoe UI, Arial, sans-serif">schema, censoring, horizon mix,</text>
  <text x="96" y="312" fill="#CBD5E1" font-size="17" font-weight="500" font-family="Segoe UI, Arial, sans-serif">feature groups from metadata</text>

  <rect x="386" y="196" width="250" height="130" rx="24" fill="url(#card)" stroke="#38BDF8" stroke-opacity="0.48"/>
  <text x="414" y="244" fill="#BAE6FD" font-size="24" font-weight="700" font-family="Segoe UI, Arial, sans-serif">2. Visual Insight</text>
  <text x="414" y="282" fill="#CBD5E1" font-size="17" font-weight="500" font-family="Segoe UI, Arial, sans-serif">event timing, risk composition,</text>
  <text x="414" y="312" fill="#CBD5E1" font-size="17" font-weight="500" font-family="Segoe UI, Arial, sans-serif">high-value exploratory plots</text>

  <rect x="704" y="196" width="250" height="130" rx="24" fill="url(#card)" stroke="#22C55E" stroke-opacity="0.48"/>
  <text x="732" y="244" fill="#BBF7D0" font-size="24" font-weight="700" font-family="Segoe UI, Arial, sans-serif">3. Feature Engineering</text>
  <text x="732" y="282" fill="#CBD5E1" font-size="17" font-weight="500" font-family="Segoe UI, Arial, sans-serif">distance dynamics, quality,</text>
  <text x="732" y="312" fill="#CBD5E1" font-size="17" font-weight="500" font-family="Segoe UI, Arial, sans-serif">sparse splits, rank signals</text>

  <rect x="1022" y="196" width="310" height="130" rx="24" fill="url(#card)" stroke="#FB7185" stroke-opacity="0.48"/>
  <text x="1050" y="244" fill="#FECDD3" font-size="24" font-weight="700" font-family="Segoe UI, Arial, sans-serif">4. Family-aware Selection</text>
  <text x="1050" y="282" fill="#CBD5E1" font-size="17" font-weight="500" font-family="Segoe UI, Arial, sans-serif">permutation importance with caps</text>
  <text x="1050" y="312" fill="#CBD5E1" font-size="17" font-weight="500" font-family="Segoe UI, Arial, sans-serif">to preserve balanced signal coverage</text>

  <path d="M318 261H368" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <path d="M358 253L370 261L358 269" stroke="#64748B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M636 261H686" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <path d="M676 253L688 261L676 269" stroke="#64748B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M954 261H1004" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <path d="M994 253L1006 261L994 269" stroke="#64748B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="68" y="408" width="398" height="190" rx="24" fill="url(#card)" stroke="#A78BFA" stroke-opacity="0.5"/>
  <text x="96" y="454" fill="#DDD6FE" font-size="24" font-weight="700" font-family="Segoe UI, Arial, sans-serif">5. Model Candidates</text>
  <rect x="96" y="484" width="96" height="36" rx="18" fill="#111827" stroke="#F59E0B" stroke-opacity="0.72"/>
  <text x="144" y="508" text-anchor="middle" fill="#FDE68A" font-size="16" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Cox PH</text>
  <rect x="204" y="484" width="96" height="36" rx="18" fill="#111827" stroke="#38BDF8" stroke-opacity="0.72"/>
  <text x="252" y="508" text-anchor="middle" fill="#BAE6FD" font-size="16" font-weight="700" font-family="Segoe UI, Arial, sans-serif">RSF</text>
  <rect x="312" y="484" width="96" height="36" rx="18" fill="#111827" stroke="#22C55E" stroke-opacity="0.72"/>
  <text x="360" y="508" text-anchor="middle" fill="#BBF7D0" font-size="16" font-weight="700" font-family="Segoe UI, Arial, sans-serif">GBM</text>
  <rect x="96" y="536" width="106" height="36" rx="18" fill="#111827" stroke="#FB7185" stroke-opacity="0.72"/>
  <text x="149" y="560" text-anchor="middle" fill="#FECDD3" font-size="16" font-weight="700" font-family="Segoe UI, Arial, sans-serif">LightGBM</text>
  <rect x="214" y="536" width="96" height="36" rx="18" fill="#111827" stroke="#0EA5E9" stroke-opacity="0.72"/>
  <text x="262" y="560" text-anchor="middle" fill="#BAE6FD" font-size="16" font-weight="700" font-family="Segoe UI, Arial, sans-serif">XGBoost</text>
  <rect x="322" y="536" width="96" height="36" rx="18" fill="#111827" stroke="#F97316" stroke-opacity="0.72"/>
  <text x="370" y="560" text-anchor="middle" fill="#FED7AA" font-size="16" font-weight="700" font-family="Segoe UI, Arial, sans-serif">CatBoost</text>

  <rect x="504" y="408" width="398" height="190" rx="24" fill="url(#card)" stroke="#38BDF8" stroke-opacity="0.5"/>
  <text x="532" y="454" fill="#BAE6FD" font-size="24" font-weight="700" font-family="Segoe UI, Arial, sans-serif">6. Repeated CV / OOF</text>
  <text x="532" y="500" fill="#E2E8F0" font-size="18" font-weight="500" font-family="Segoe UI, Arial, sans-serif">5 folds x 5 repeats</text>
  <text x="532" y="536" fill="#E2E8F0" font-size="18" font-weight="500" font-family="Segoe UI, Arial, sans-serif">stable out-of-fold model comparison</text>
  <text x="532" y="572" fill="#94A3B8" font-size="17" font-weight="500" font-family="Segoe UI, Arial, sans-serif">Designed to reduce split luck on a 221-row training set.</text>

  <rect x="940" y="408" width="392" height="190" rx="24" fill="url(#card)" stroke="#F59E0B" stroke-opacity="0.5"/>
  <text x="968" y="454" fill="#FDE68A" font-size="24" font-weight="700" font-family="Segoe UI, Arial, sans-serif">7. Blend Search</text>
  <text x="968" y="500" fill="#E2E8F0" font-size="18" font-weight="500" font-family="Segoe UI, Arial, sans-serif">fine alpha sweep for RSF + GBM</text>
  <text x="968" y="536" fill="#E2E8F0" font-size="18" font-weight="500" font-family="Segoe UI, Arial, sans-serif">global blend and horizon-specific blend</text>
  <text x="968" y="572" fill="#94A3B8" font-size="17" font-weight="500" font-family="Segoe UI, Arial, sans-serif">Calibration is treated as a candidate, not always the default.</text>

  <rect x="68" y="662" width="1264" height="172" rx="26" fill="url(#card)" stroke="#22C55E" stroke-opacity="0.45"/>
  <text x="96" y="710" fill="#BBF7D0" font-size="24" font-weight="700" font-family="Segoe UI, Arial, sans-serif">8. Final submission logic</text>
  <text x="96" y="752" fill="#E2E8F0" font-size="18" font-weight="500" font-family="Segoe UI, Arial, sans-serif">Choose the strongest candidate by hybrid score behavior, generate monotonic horizon probabilities, and export a file whose name matches the selected method.</text>
  <text x="96" y="792" fill="#94A3B8" font-size="17" font-weight="500" font-family="Segoe UI, Arial, sans-serif">The output remains schema-safe: valid IDs, probabilities in range, and monotone 12h <= 24h <= 48h <= 72h.</text>
</svg>
