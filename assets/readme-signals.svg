<svg width="1400" height="860" viewBox="0 0 1400 860" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dataset and signal overview">
  <defs>
    <linearGradient id="bg" x1="84" y1="72" x2="1328" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08131F"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#18212F"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#161C30"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="860" rx="32" fill="url(#bg)"/>
  <text x="68" y="92" fill="#F8FAFC" font-size="40" font-weight="800" font-family="Segoe UI, Arial, sans-serif">Dataset Signals</text>
  <text x="68" y="132" fill="#94A3B8" font-size="20" font-weight="500" font-family="Segoe UI, Arial, sans-serif">The raw features are not random columns. They describe distance, growth, movement, and observation quality.</text>

  <rect x="68" y="182" width="620" height="300" rx="24" fill="url(#panel)" stroke="#38BDF8" stroke-opacity="0.45"/>
  <text x="96" y="226" fill="#BAE6FD" font-size="24" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Feature families</text>
  <text x="96" y="274" fill="#CBD5E1" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Growth</text>
  <rect x="270" y="260" width="260" height="14" rx="7" fill="#1F2937"/>
  <rect x="270" y="260" width="228" height="14" rx="7" fill="#F97316"/>
  <text x="550" y="274" fill="#94A3B8" font-size="16" font-weight="600" font-family="Segoe UI, Arial, sans-serif">10</text>
  <text x="96" y="316" fill="#CBD5E1" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Distance</text>
  <rect x="270" y="302" width="260" height="14" rx="7" fill="#1F2937"/>
  <rect x="270" y="302" width="206" height="14" rx="7" fill="#38BDF8"/>
  <text x="550" y="316" fill="#94A3B8" font-size="16" font-weight="600" font-family="Segoe UI, Arial, sans-serif">9</text>
  <text x="96" y="358" fill="#CBD5E1" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Centroid kinematics</text>
  <rect x="270" y="344" width="260" height="14" rx="7" fill="#1F2937"/>
  <rect x="270" y="344" width="120" height="14" rx="7" fill="#22C55E"/>
  <text x="550" y="358" fill="#94A3B8" font-size="16" font-weight="600" font-family="Segoe UI, Arial, sans-serif">5</text>
  <text x="96" y="400" fill="#CBD5E1" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Directionality</text>
  <rect x="270" y="386" width="260" height="14" rx="7" fill="#1F2937"/>
  <rect x="270" y="386" width="92" height="14" rx="7" fill="#FB7185"/>
  <text x="550" y="400" fill="#94A3B8" font-size="16" font-weight="600" font-family="Segoe UI, Arial, sans-serif">4</text>
  <text x="96" y="442" fill="#CBD5E1" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Temporal coverage + metadata</text>
  <rect x="270" y="428" width="260" height="14" rx="7" fill="#1F2937"/>
  <rect x="270" y="428" width="136" height="14" rx="7" fill="#A78BFA"/>
  <text x="550" y="442" fill="#94A3B8" font-size="16" font-weight="600" font-family="Segoe UI, Arial, sans-serif">6</text>

  <rect x="714" y="182" width="618" height="300" rx="24" fill="url(#panel)" stroke="#F59E0B" stroke-opacity="0.45"/>
  <text x="742" y="226" fill="#FDE68A" font-size="24" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Why the signal is meaningful</text>
  <text x="742" y="274" fill="#E2E8F0" font-size="18" font-weight="500" font-family="Segoe UI, Arial, sans-serif">Distance tells us immediate spatial pressure.</text>
  <text x="742" y="314" fill="#E2E8F0" font-size="18" font-weight="500" font-family="Segoe UI, Arial, sans-serif">Closing speed tells us whether the fire is moving toward the threat zone.</text>
  <text x="742" y="354" fill="#E2E8F0" font-size="18" font-weight="500" font-family="Segoe UI, Arial, sans-serif">Alignment tells us if movement direction matches evacuation geometry.</text>
  <text x="742" y="394" fill="#E2E8F0" font-size="18" font-weight="500" font-family="Segoe UI, Arial, sans-serif">Observation density tells us how trustworthy early behavior estimates are.</text>
  <text x="742" y="434" fill="#94A3B8" font-size="17" font-weight="500" font-family="Segoe UI, Arial, sans-serif">This is why feature engineering focuses on shaping a few reliable signals well.</text>

  <rect x="68" y="524" width="620" height="266" rx="24" fill="url(#panel)" stroke="#22C55E" stroke-opacity="0.45"/>
  <text x="96" y="568" fill="#BBF7D0" font-size="24" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Feature engineering themes</text>
  <text x="96" y="616" fill="#CBD5E1" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Distance dynamics</text>
  <text x="286" y="616" fill="#94A3B8" font-size="18" font-weight="500" font-family="Segoe UI, Arial, sans-serif">dist_min_log, dist_over_close, dist_minus_proj</text>
  <text x="96" y="654" fill="#CBD5E1" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Sparse decomposition</text>
  <text x="286" y="654" fill="#94A3B8" font-size="18" font-weight="500" font-family="Segoe UI, Arial, sans-serif">closing_pos, closing_neg, projected_advance_pos</text>
  <text x="96" y="692" fill="#CBD5E1" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Temporal quality</text>
  <text x="286" y="692" fill="#94A3B8" font-size="18" font-weight="500" font-family="Segoe UI, Arial, sans-serif">perimeter_density, perimeter_gap, obs_quality</text>
  <text x="96" y="730" fill="#CBD5E1" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Rank features</text>
  <text x="286" y="730" fill="#94A3B8" font-size="18" font-weight="500" font-family="Segoe UI, Arial, sans-serif">percentile signals for the most stable predictors</text>

  <rect x="714" y="524" width="618" height="266" rx="24" fill="url(#panel)" stroke="#FB7185" stroke-opacity="0.45"/>
  <text x="742" y="568" fill="#FECDD3" font-size="24" font-weight="700" font-family="Segoe UI, Arial, sans-serif">The hardest part of this dataset</text>
  <text x="742" y="616" fill="#E2E8F0" font-size="18" font-weight="500" font-family="Segoe UI, Arial, sans-serif">Small sample size means feature explosion can hurt more than help.</text>
  <text x="742" y="654" fill="#E2E8F0" font-size="18" font-weight="500" font-family="Segoe UI, Arial, sans-serif">Censoring means some horizons behave differently from ordinary labels.</text>
  <text x="742" y="692" fill="#E2E8F0" font-size="18" font-weight="500" font-family="Segoe UI, Arial, sans-serif">48h matters most operationally, so probability shape is as important as ranking.</text>
  <text x="742" y="730" fill="#94A3B8" font-size="18" font-weight="500" font-family="Segoe UI, Arial, sans-serif">The notebook is designed around that exact constraint set.</text>
</svg>
