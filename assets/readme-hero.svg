    <rect x="318" y="150" width="204" height="14" rx="7" fill="#22C55E"/>
  </g>

  <g transform="translate(884 150)">
    <rect x="0" y="0" width="560" height="190" rx="26" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="28" y="42" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Competition framing</text>
    <text x="28" y="82" fill="#CBD5E1" font-size="18" font-weight="500" font-family="Segoe UI, Arial, sans-serif">Right-censored survival problem with horizon outputs</text>
    <text x="28" y="118" fill="#94A3B8" font-size="17" font-weight="400" font-family="Segoe UI, Arial, sans-serif">Hybrid Score = 0.3 * C-index + 0.7 * (1 - Weighted Brier)</text>
    <text x="28" y="148" fill="#94A3B8" font-size="17" font-weight="400" font-family="Segoe UI, Arial, sans-serif">The operational sweet spot is 24h to 48h, with 48h weighted highest.</text>
    <rect x="28" y="164" width="112" height="18" rx="9" fill="#F97316"/>
    <rect x="152" y="164" width="164" height="18" rx="9" fill="#0EA5E9"/>
    <rect x="328" y="164" width="204" height="18" rx="9" fill="#22C55E"/>
  </g>

