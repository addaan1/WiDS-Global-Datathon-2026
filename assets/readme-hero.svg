    <text x="211" y="89" text-anchor="middle" fill="#BAE6FD" font-size="16" font-weight="700" font-family="Segoe UI, Arial, sans-serif">RSF</text>
    <rect x="280" y="64" width="114" height="38" rx="19" fill="#111827" stroke="#22C55E" stroke-opacity="0.7"/>
    <text x="337" y="89" text-anchor="middle" fill="#BBF7D0" font-size="16" font-weight="700" font-family="Segoe UI, Arial, sans-serif">GBM</text>
    <rect x="406" y="64" width="126" height="38" rx="19" fill="#111827" stroke="#FB7185" stroke-opacity="0.7"/>
    <text x="469" y="89" text-anchor="middle" fill="#FECDD3" font-size="16" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Direct LR</text>
    <path d="M36 144C108 122 150 136 200 122C258 106 298 74 356 82C408 90 448 132 518 118" stroke="#F97316" stroke-width="6" stroke-linecap="round"/>
    <path d="M36 156C110 146 156 162 214 146C262 132 304 102 356 108C414 114 448 154 518 150" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
