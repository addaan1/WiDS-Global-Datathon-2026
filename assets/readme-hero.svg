  <text x="126" y="164" fill="#F8FAFC" font-size="26" font-weight="700" font-family="Segoe UI, Arial, sans-serif">WiDS Global Datathon 2026</text>
  <text x="126" y="252" fill="#F8FAFC" font-size="72" font-weight="800" font-family="Segoe UI, Arial, sans-serif">Survival Analysis for</text>
  <text x="126" y="330" fill="#F8FAFC" font-size="72" font-weight="800" font-family="Segoe UI, Arial, sans-serif">Wildfire Threat Timing</text>
  <text x="126" y="386" fill="#CBD5E1" font-size="26" font-weight="500" font-family="Segoe UI, Arial, sans-serif">
    Predict whether a fire will threaten an evacuation zone within 12h, 24h, 48h, and 72h
  </text>
  <text x="126" y="424" fill="#94A3B8" font-size="22" font-weight="400" font-family="Segoe UI, Arial, sans-serif">
    using only the first 5 hours of perimeter behavior, spread geometry, and zone-distance signals.
  </text>

  <g>
    <rect x="126" y="470" width="148" height="52" rx="26" fill="url(#accent)"/>
    <text x="200" y="504" text-anchor="middle" fill="#111827" font-size="20" font-weight="800" font-family="Segoe UI, Arial, sans-serif">221 train</text>
