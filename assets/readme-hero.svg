    <text x="28" y="40" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Workflow summary</text>
    <text x="28" y="78" fill="#CBD5E1" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Data understanding</text>
    <text x="200" y="78" fill="#94A3B8" font-size="18" font-weight="500" font-family="Segoe UI, Arial, sans-serif">-> Visual insight -> Feature engineering</text>
    <text x="28" y="110" fill="#CBD5E1" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Family-aware selection</text>
    <text x="240" y="110" fill="#94A3B8" font-size="18" font-weight="500" font-family="Segoe UI, Arial, sans-serif">-> Repeated CV / OOF</text>
    <text x="28" y="142" fill="#CBD5E1" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Blend search</text>
    <text x="156" y="142" fill="#94A3B8" font-size="18" font-weight="500" font-family="Segoe UI, Arial, sans-serif">-> Calibration candidate -> Final submission</text>
    <text x="28" y="170" fill="#64748B" font-size="16" font-weight="500" font-family="Segoe UI, Arial, sans-serif">Notebook-first, score-aware, and built to remain readable.</text>
