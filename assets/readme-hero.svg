    <text x="977" y="36" text-anchor="middle" fill="#FECDD3" font-size="18" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">Blend &</text>
    <text x="977" y="62" text-anchor="middle" fill="#E2E8F0" font-size="16" font-weight="500" font-family="Inter, Segoe UI, Arial, sans-serif">Calibration</text>

    <path d="M1096 45H1146" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <path d="M1136 37L1148 45L1136 53" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1160" y="0" width="214" height="90" rx="20" fill="url(#panel)" stroke="#F97316" stroke-opacity="0.55"/>
    <text x="1267" y="36" text-anchor="middle" fill="#FED7AA" font-size="18" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">Final</text>
    <text x="1267" y="62" text-anchor="middle" fill="#E2E8F0" font-size="16" font-weight="500" font-family="Inter, Segoe UI, Arial, sans-serif">Submission</text>
