<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WiDS Global Datathon 2026 hero banner">
  <defs>
    <linearGradient id="bg" x1="74" y1="84" x2="1516" y2="826" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081224"/>
      <stop offset="0.45" stop-color="#111827"/>
      <stop offset="1" stop-color="#2A130B"/>
    </linearGradient>
    <radialGradient id="fireGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1320 208) rotate(138) scale(420 310)">
      <stop stop-color="#FB923C" stop-opacity="0.42"/>
